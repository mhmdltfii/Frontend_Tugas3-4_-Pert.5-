
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usaha Merah Putih</title>

    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/logic.js" defer></script>
</head>
<body>

    <header>
        <h1>Usaha Merah Putih</h1>
        <p>Platform pendataan produk UMKM</p>
    </header>

    <main>
        <!-- Form Input Produk -->
        <section class="card">
            <h2>Tambah Produk Baru</h2>

            <form id="formProduk">
                <div class="form-group">
                    <label for="nama">Nama Produk</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama produk"
                    >
                </div>

                <div class="form-group">
                    <label for="harga">Harga Produk (Rp)</label>
                    <input
                        type="number"
                        id="harga"
                        placeholder="Contoh: 15000"
                        min="1"
                    >
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori Produk</label>
                    <select id="kategori" required>
                        <option value="">Pilih kategori</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Minuman">Minuman</option>
                        <option value="Kerajinan">Kerajinan</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="stok">Stok Produk</label>
                    <input
                        type="number"
                        id="stok"
                        placeholder="Masukkan jumlah stok"
                        min="0"
                        required
                    >
                </div>

                <button type="submit">Tambah Produk</button>
            </form>

            <div id="feedback" class="feedback"
                 role="status" aria-live="polite"></div>
        </section>

        <!-- Live Preview -->
        <section class="card">
            <h2>Preview Produk</h2>

            <div class="preview">
                <p><strong>Nama:</strong> <span id="previewNama">-</span></p>
                <p><strong>Harga:</strong> <span id="previewHarga">Rp0</span></p>
                <p><strong>Kategori:</strong> <span id="previewKategori">-</span></p>
                <p><strong>Stok:</strong> <span id="previewStok">0</span></p>
            </div>
        </section>

        <!-- Daftar Produk -->
        <section class="card">
            <h2>Daftar Produk</h2>

            <div id="daftarProduk">
                <p class="kosong">Belum ada produk yang ditambahkan.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Usaha Merah Putih</p>
    </footer>

</body>
</html>
